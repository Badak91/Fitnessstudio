<main class="login-page">

  <div class="login-overlay"></div>

  <section class="login-card">

    <p class="brand">WORKOUT Fitness-Studio</p>

    <h1>Login</h1>

    <p class="login-text">
      Melde dich an, um die Mitgliederverwaltung zu öffnen.
    </p>

    <form (ngSubmit)="login()">

      <div class="form-group">

        <label for="username">
          Benutzername
        </label>

        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          required
        />

      </div>

      <div class="form-group">

        <label for="password">
          Passwort
        </label>

        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
        />

      </div>

      <p id="login-error">
        {{ loginError }}
      </p>

      <button
        type="submit"
        class="login-button"
      >
        Einloggen
      </button>

    </form>

    <p class="hint">
      Test-Login:
      <strong>admin</strong> /
      <strong>1234</strong>
    </p>

    <a routerLink="/" class="back-link">
      ← Zurück zur Startseite
    </a>

  </section>

</main>
